<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F12" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Night Map — a field instrument for San Francisco after dark. Find resources, plan walking routes, and keep private field notes."
    />
    <title>Night Map · San Francisco after dark</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Paint a meaningful state before the application bundle arrives. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d1317;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #0d1317;
        background-image:
          linear-gradient(rgba(148, 163, 170, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 170, 0.035) 1px, transparent 1px);
        background-size: 64px 64px;
      }

      .boot-card {
        box-sizing: border-box;
        width: min(420px, 100%);
        padding: 24px 26px 22px;
        border: 1px solid #24342f;
        border-radius: 14px;
        background: rgba(11, 19, 16, 0.97);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        color: #e9e5dc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-eyebrow {
        margin: 0 0 10px;
        color: #e0a458;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .boot-card h2 {
        margin: 0 0 8px;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.1;
      }

      .boot-card p:not(.boot-eyebrow) {
        margin: 0;
        color: #b8c1bf;
        font-size: 13px;
        line-height: 1.55;
      }

      .boot-bar {
        display: block;
        height: 3px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 2px;
        background: #1d2925;
      }

      .boot-bar > span {
        display: block;
        width: 38%;
        height: 100%;
        background: #e0a458;
        animation: boot-sweep 1.15s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(290%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-bar > span {
          width: 100%;
          animation: none;
          opacity: 0.45;
        }
      }

      @media (max-width: 720px) {
        #boot-loader {
          padding: 18px;
        }

        .boot-card {
          padding: 20px;
        }

        .boot-card h2 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-card">
        <p class="boot-eyebrow">Night Map · San Francisco</p>
        <h2>Charting the streets</h2>
        <p>The basemap and street network are still loading. The map will appear when the road grid is ready.</p>
        <span class="boot-bar" aria-hidden="true"><span></span></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const boot = document.getElementById('boot-loader');
        if (!boot) return;
        const removeWhenAppPaints = () => {
          if (document.querySelector('.map-stage, .map-loading')) {
            boot.remove();
            return;
          }
          requestAnimationFrame(removeWhenAppPaints);
        };
        requestAnimationFrame(removeWhenAppPaints);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
