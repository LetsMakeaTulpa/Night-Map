name: Night Map live preview (URL status)

on:
  push:
    branches:
      - 'preview/live-v2'

permissions:
  contents: read
  statuses: write

concurrency:
  group: night-map-full-app-preview-v2
  cancel-in-progress: true

jobs:
  preview:
    name: Build and serve the actual Night Map app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact feature-branch source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate the shipped civic snapshots
        run: npm run data:validate:incidents
      - name: Build the production PWA
        run: npm run build
      - name: Confirm the production output exists
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          echo "Production build contains $(find dist -type f | wc -l) files."
      - name: Start Vite production preview
        env:
          __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .trycloudflare.com
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 3000 >/tmp/night-map-vite.log 2>&1 </dev/null &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Vite production preview is responding."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/night-map-vite.log
          exit 1
      - name: Install Cloudflare quick-tunnel client
        run: |
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
      - name: Publish and verify temporary preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate --protocol http2 >/tmp/night-map-tunnel.log 2>&1 </dev/null &
          PREVIEW_URL=""
          for i in $(seq 1 90); do
            PREVIEW_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/night-map-tunnel.log | head -n 1 || true)"
            if [ -n "$PREVIEW_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$PREVIEW_URL" ]; then
            cat /tmp/night-map-tunnel.log
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "## Night Map — full application preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$PREVIEW_URL**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from feature/scenes-hideaways-chillness at commit d26fda7. This temporary URL serves the original production build while this workflow job is running." >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_PREVIEW_URL=$PREVIEW_URL"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="success" \
            -f context="Night Map preview" \
            -f description="Temporary production preview is live" \
            -f target_url="$PREVIEW_URL"
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 12 "$PREVIEW_URL/" >/dev/null 2>&1; then
              echo "Public preview endpoint returned HTTP successfully."
              break
            fi
            sleep 2
          done
      - name: Keep preview online for 15 minutes
        run: |
          for i in $(seq 1 15); do
            TUNNEL_PID="$(pgrep -f '/tmp/cloudflared tunnel --url' | head -n 1 || true)"
            if [ -z "$TUNNEL_PID" ]; then
              echo "Cloudflare tunnel process exited."
              cat /tmp/night-map-tunnel.log
              exit 1
            fi
            sleep 60
          done
          echo "Preview window complete; the temporary tunnel will now close."
