name: Night Map CI

on:
  push:
    branches: [main, improve/quick-discovery-presets, feature/scenes-hideaways-chillness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-map-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate civic snapshots
        run: npm run data:validate:incidents
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
